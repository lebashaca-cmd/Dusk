# Render Blueprint. In Render: New > Blueprint, pick your repo.
# Data lives in Supabase (see supabase/setup.sql), so no persistent disk is needed.
services:
  - type: web
    name: dusk
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/stats
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_INVITE_URL
        sync: false
      - key: DUSK_CREDIT_URL
        sync: false
      - key: DUSK_OWNER_IDS
        sync: false
      - key: DUSK_DEV_IDS
        sync: false
      - key: DUSK_VIP_IDS
        sync: false
      - key: DUSK_VIP_ROLES
        sync: false
      - key: DUSK_ADMIN_TOKEN
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
